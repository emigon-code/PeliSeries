<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeliSeries</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos para que el scroll del modal sea más fino */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4B5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        
        <!-- Cabecera con el icono de palomitas -->
        <header class="mb-6 text-center mt-8">
            <h1 class="text-5xl font-bold text-indigo-500 mb-4 flex items-center justify-center gap-3">
                🍿 PeliSeries
            </h1>
        </header>

        <!-- Panel de Autenticación / Menú de usuario -->
        <div id="authPanel" class="max-w-md mx-auto mb-10 bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
            <!-- Formulario de Login -->
            <div id="loginForm" class="flex flex-col gap-3">
                <input type="email" id="emailInput" placeholder="Tu correo de Supabase" class="p-3 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="password" id="passInput" placeholder="Contraseña" class="p-3 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="loginBtn" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded text-white font-bold transition-colors">Iniciar Sesión</button>
            </div>
            
            <!-- Zona de usuario logueado -->
            <div id="userLogged" class="hidden text-center">
                <div class="flex justify-center items-center gap-4 mb-5">
                    <span class="text-green-400 font-bold">✅ Sesión iniciada</span>
                    <button id="logoutBtn" class="text-sm text-gray-400 hover:text-white underline">Cerrar sesión</button>
                </div>
                <!-- Navegación -->
                <div class="flex justify-center gap-4">
                    <button id="btnNavSearch" class="bg-indigo-600 px-6 py-2 rounded-full font-bold text-white transition-colors">Buscador</button>
                    <button id="btnNavList" class="bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-full font-bold text-white transition-colors">Mi Lista</button>
                </div>
            </div>
        </div>

        <!-- VISTA 1: BUSCADOR -->
        <div id="viewSearch">
            <div class="flex gap-3 mb-10 max-w-2xl mx-auto">
                <input type="text" id="searchInput" placeholder="Ej. El Señor de los Anillos, Breaking Bad..." 
                    class="w-full p-4 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:border-indigo-500 text-white text-lg shadow-inner">
                <button id="searchBtn" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-4 rounded-xl font-bold text-lg transition-colors text-white shadow-lg">Buscar</button>
            </div>
            <div id="resultsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
        </div>

        <!-- VISTA 2: MI LISTA -->
        <div id="viewList" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-300">Mi Biblioteca</h2>
            <div id="myListGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
        </div>

    </div>

    <!-- MODAL PARA EPISODIOS -->
    <div id="modalEpisodios" class="hidden fixed inset-0 bg-black bg-opacity-90 flex justify-center items-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl border border-gray-600">
            
            <!-- Cabecera del modal con botón de Marcar Serie Completa -->
            <div class="p-4 border-b border-gray-700 flex justify-between items-center gap-4 flex-wrap">
                <h2 id="modalTitle" class="text-xl font-bold text-white line-clamp-1 flex-grow">Cargando...</h2>
                <div class="flex items-center gap-3">
                    <button id="btnMarcarSerie" class="bg-green-700 hover:bg-green-600 text-white text-sm font-bold py-1 px-3 rounded shadow transition-colors">
                        ✓ Marcar serie completa
                    </button>
                    <button onclick="cerrarModal()" class="text-gray-400 hover:text-white font-bold text-3xl transition-colors leading-none">&times;</button>
                </div>
            </div>
            
            <!-- Contenedor scrollable de las temporadas -->
            <div id="modalContent" class="p-4 overflow-y-auto flex-grow custom-scrollbar">
                <!-- El JS inyecta las temporadas aquí -->
            </div>
            
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
